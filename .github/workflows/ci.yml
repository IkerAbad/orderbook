name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      - name: Run the installed CLI
        shell: bash
        run: |
          exe=./install/bin/orderbook
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --version

      - name: Build a consumer
        shell: bash
        run: |
          cmake -S examples/consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build consumer-build
          exe=./consumer-build/consumer
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe"

      - name: Build a package
        shell: bash
        run: |
          cd build
          cpack -G ZIP
          test -f orderbook-*.zip

      - name: Build a source package
        shell: bash
        run: |
          cd build
          cpack --config CPackSourceConfig.cmake -G TGZ
          arc=$(ls orderbook-*-Source.tar.gz | head -n 1)
          test -f "$arc"
          if cmake -E tar tf "$arc" | grep -qE '(^|/)(build|install|consumer-build)/'; then
            echo "source package contains a build directory"
            exit 1
          fi

      - name: Build without tests
        run: |
          cmake -S . -B build-min -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build-min

      - name: Build library only
        run: |
          cmake -S . -B build-lib -G Ninja -DCMAKE_BUILD_TYPE=Release -DORDERBOOK_BUILD_CLI=OFF -DBUILD_TESTING=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build-lib

      - name: Generate a trace and replay it
        shell: bash
        run: |
          exe=./build/orderbook
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" generate --events 20000 --seed 1 --out trace.csv
          "$exe" replay trace.csv
          "$exe" bench --events 100000 --seed 1 --runs 1 --impl all
          "$exe" depth --events 20000 --seed 1 --frames 5 --out depth.csv
          test -s depth.csv

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DORDERBOOK_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Fuzz the parser
        run: ./build/fuzz_parse_csv -max_total_time=60 -timeout=10 -print_final_stats=1 fuzz/corpus_parse

      - name: Fuzz the books
        run: ./build/fuzz_book -max_total_time=60 -timeout=10 -print_final_stats=1 fuzz/corpus_book

      - name: Upload parser corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-parse
          path: fuzz/corpus_parse

      - name: Upload book corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-book
          path: fuzz/corpus_book

  fuzz-long:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DORDERBOOK_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Fuzz the parser
        run: ./build/fuzz_parse_csv -max_total_time=600 -timeout=10 -print_final_stats=1 fuzz/corpus_parse

      - name: Fuzz the books
        run: ./build/fuzz_book -max_total_time=600 -timeout=10 -print_final_stats=1 fuzz/corpus_book

      - name: Upload parser corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-parse-long
          path: fuzz/corpus_parse

      - name: Upload book corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-book-long
          path: fuzz/corpus_book

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Report
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
          gcovr -r . build/coverage --filter "src/" --exclude "src/main.cpp" --fail-under-line 90 --txt
