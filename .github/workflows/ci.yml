name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      - name: Generate a trace and replay it
        shell: bash
        run: |
          exe=./build/orderbook
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" generate --events 20000 --seed 1 --out trace.csv
          "$exe" replay trace.csv
          "$exe" bench --events 100000 --seed 1 --runs 1 --impl all
          "$exe" depth --events 20000 --seed 1 --frames 5 --out depth.csv
          test -s depth.csv

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DORDERBOOK_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Fuzz the parser
        run: ./build/fuzz_parse_csv -max_total_time=60 -timeout=10 -print_final_stats=1 fuzz/corpus_parse

      - name: Fuzz the books
        run: ./build/fuzz_book -max_total_time=60 -timeout=10 -print_final_stats=1 fuzz/corpus_book

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Report
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
          gcovr -r . build/coverage --filter "src/" --exclude "src/main.cpp" --fail-under-line 90 --txt
