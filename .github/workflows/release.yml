name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install and run
        shell: bash
        run: |
          cmake --install build --prefix install
          exe=./install/bin/orderbook
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --version

      - name: Build binary package
        shell: bash
        run: |
          cd build
          cpack -G ZIP

      - name: Build source package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd build
          cpack --config CPackSourceConfig.cmake -G TGZ

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build/orderbook-*.zip

      - name: Upload source package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package-source
          path: build/orderbook-*-Source.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        run: |
          awk 'BEGIN{flag=0} /^## 1\.0\.0/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "orderbook ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
